<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX Chat</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; height: 100vh; margin: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 10px; }
  .message { margin: 5px 0; }
  .user { color: #4fc3f7; }
  .zx { color: #ffca28; }
  #inputForm { display: flex; padding: 10px; background: #222; }
  #messageInput { flex: 1; padding: 8px; border: none; border-radius: 4px; margin-right: 5px; background: #333; color: #eee; }
  #sendBtn { padding: 8px 12px; border: none; border-radius: 4px; background: #4fc3f7; color: #000; cursor: pointer; }
  #sendBtn:hover { background: #29b6f6; }
</style>
</head>
<body>

<div id="chat"></div>

<form id="inputForm">
  <input type="text" id="messageInput" placeholder="Digite algo..." autocomplete="off" />
  <button type="submit" id="sendBtn">Enviar</button>
</form>

<script>
const chatDiv = document.getElementById('chat');
const form = document.getElementById('inputForm');
const input = document.getElementById('messageInput');

const memory = [];

// Adiciona mensagem na tela
function addMessage(sender, text) {
  const msgDiv = document.createElement('div');
  msgDiv.classList.add('message', sender);
  msgDiv.textContent = text;
  chatDiv.appendChild(msgDiv);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

// Envia mensagem pro servidor
async function sendMessage(msg) {
  memory.push({ role: 'user', content: msg });
  addMessage('user', msg);

  try {
    const res = await fetch('https://zx-auth.onrender.com/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, memory })
    });
    const data = await res.json();
    const reply = data.reply || "ZX não respondeu.";
    memory.push({ role: 'zx', content: reply });
    addMessage('zx', reply);
  } catch (err) {
    addMessage('zx', 'Erro ao conectar com ZX.');
    console.error(err);
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  sendMessage(msg);
});
</script>

</body>
</html>
